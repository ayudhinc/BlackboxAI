# Local development services. Host ports are registered in ~/dev/ports.md.
services:
  postgres:
    image: postgres:17
    container_name: blackbox-postgres
    environment:
      POSTGRES_USER: blackbox
      POSTGRES_PASSWORD: blackbox
      POSTGRES_DB: blackbox
    ports:
      - "127.0.0.1:5476:5432"
    volumes:
      - blackbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackbox -d blackbox"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  blackbox_pgdata:
