# Fly.io app for the BlackboxAI worker. Not public: no http_service.
# Secrets (set with `fly secrets set`): DATABASE_URL, MODEL_API_KEY,
# R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET.
app = "blackbox-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  WORKER_HEALTH_HOST = "0.0.0.0"
  WORKER_HEALTH_PORT = "3502"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    type = "http"
    port = 3502
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
